name: Publish Dockerhub

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3). Leave empty to auto-increment the patch of the latest tag'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate requirements.txt
        run: |
          pip install pipreqs
          pipreqs scripts/ --savepath requirements.txt --mode no-pin --force
          cat requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tool versions
        run: python scripts/helper/tool_version_checker.py

      - name: Render Dockerfile
        run: python scripts/render.py

      - name: Upload Dockerfile
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile
          path: Dockerfile
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-22.04
    needs:
      - generate
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version '$INPUT_VERSION', expected format vX.Y.Z"
              exit 1
            fi
          else
            latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

    build:
      runs-on: ubuntu-22.04
      needs:
        - release
        - generate
      continue-on-error: ${{ matrix.experimental }}
      timeout-minutes: 60
      strategy:
        fail-fast: false
        matrix:
          include:
            - platform: linux/amd64
              experimental: false
            - platform: linux/arm64
              experimental: false
            - platform: linux/arm/v7
              experimental: true
            - platform: linux/arm/v6
              experimental: true
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Download Dockerfile
          uses: actions/download-artifact@v4
          with:
            name: dockerfile
            path: .

        - name: Prepare
          run: |
            platform=${{ matrix.platform }}
            echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

        - name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ vars.REGISTRY_IMAGE }}
            tags: |
              type=semver,pattern={{raw}},value=${{ needs.release.outputs.tag }}

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push by digest
          id: build
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            platforms: ${{ matrix.platform }}
            labels: ${{ steps.meta.outputs.labels }}
            outputs: type=image,name=${{ vars.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

        - name: Export digest
          run: |
            mkdir -p /tmp/digests
            digest="${{ steps.build.outputs.digest }}"
            touch "/tmp/digests/${digest#sha256:}"

        - name: Upload digest
          uses: actions/upload-artifact@v4
          with:
            name: digests-${{ env.PLATFORM_PAIR }}
            path: /tmp/digests/*
            if-no-files-found: error
            retention-days: 1

  merge:
    runs-on: ubuntu-22.04
    needs:
      - release
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{raw}},value=${{ needs.release.outputs.tag }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ vars.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
